<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Termômetro de aura</title>
  <meta name="robots" content="noindex">
  <style>
    /* Folha própria, curta: esta página é embutida no cartão do enigma, então ela
       imita a paleta dos desenhos em vez de carregar o CSS do site inteiro. */
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    /* sem height:100%: a altura do body precisa vir do conteúdo, porque é ela que
       a trilha lê para dimensionar o iframe. Com 100% viraria um laço. */
    html, body { margin: 0; }
    body {
      background: linear-gradient(#141d44, #0a0f26);
      color: #e9edff;
      font-family: 'DM Sans', 'Segoe UI', system-ui, sans-serif;
      padding: 12px 16px 14px;
      display: grid; grid-template-columns: 132px 1fr; gap: 10px 16px; align-items: start;
    }
    @media (max-width: 540px) { body { grid-template-columns: 112px 1fr; gap: 10px 12px; } }
    .mono { font-family: 'Space Mono', 'Courier New', monospace; }

    /* título, atravessando as duas colunas */
    .titulo {
      margin: 0;
      grid-column: 1 / -1; display: flex; align-items: center; gap: 9px;
      font-size: .98rem; font-weight: 700; color: #e9edff;
      border-bottom: 1.5px solid #2b3566; padding-bottom: 9px;
    }
    .titulo svg { width: 22px; height: 22px; flex: none; }

    /* ── o termômetro ── */
    .termo { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .termo svg { width: 100%; height: auto; display: block; }
    .rotulo { font-size: .68rem; font-weight: 700; letter-spacing: .16em; color: #8c97c9; }
    .valor { font-size: 1.9rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums;
             font-family: 'Space Mono', 'Courier New', monospace; transition: color .2s; }
    .valor.sobe  { color: #3ddc84; }
    .valor.desce { color: #ff5c7a; }
    #coluna, #bulbo { transition: y .25s, height .25s, fill .25s; }

    /* ── o resto ── */
    .direita { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .topo { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .contador { font-size: .78rem; color: #8c97c9; font-variant-numeric: tabular-nums; }

    .fita { display: flex; flex-wrap: wrap; gap: 5px; min-height: 28px; align-content: flex-start; }
    .fita span {
      font-family: 'Space Mono', 'Courier New', monospace; font-size: .85rem;
      background: #1b2452; border: 1px solid #3b4784; border-radius: 7px;
      padding: 2px 8px; font-variant-numeric: tabular-nums;
    }
    .fita span.ultimo { background: #6c5ce7; border-color: #9b7bff; color: #fff; font-weight: 700; }

    .acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (max-width: 560px) { .acoes { grid-template-columns: 1fr; } }
    button.acao {
      display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 9px;
      text-align: left; cursor: pointer; font: inherit; font-size: .86rem; line-height: 1.25;
      color: #e9edff; background: #131c46; border: 1.5px solid #2b3566;
      border-radius: 11px; padding: 7px 10px;
    }
    button.acao:hover:not(:disabled) { border-color: #6c5ce7; }
    button.acao:disabled { opacity: .45; cursor: not-allowed; }
    button.acao svg { width: 34px; height: 34px; display: block; }
    button.acao .n { font-family: 'Space Mono', 'Courier New', monospace; font-weight: 700; font-size: .98rem; }
    .mais  { color: #3ddc84; }
    .menos { color: #ff5c7a; }

    .rodape { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    button.reset {
      cursor: pointer; font: inherit; font-size: .88rem; color: #e9edff; background: transparent;
      border: 1.5px solid #3b4784; border-radius: 999px; padding: 5px 14px;
    }
    button.reset:hover { border-color: #9b7bff; }
    .aviso { font-size: .76rem; color: #f2b705; min-height: 1.1em; }

    /* os braços do six seven sobem e descem */
    .braco-a, .braco-b { animation: troca 1.4s steps(1, end) infinite; }
    .braco-b { animation-delay: .7s; }
    @keyframes troca { 0% { opacity: 1 } 50% { opacity: 0 } 100% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) {
      .braco-a, .braco-b { animation: none; }
      .braco-b { opacity: .35; }
    }
  </style>
</head>
<body>
  <h1 class="titulo">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="9" y="2" width="6" height="15" rx="3" fill="none" stroke="#9b7bff" stroke-width="2"/>
      <circle cx="12" cy="19" r="4" fill="#9b7bff"/>
      <path d="M12 13 v4" stroke="#9b7bff" stroke-width="2.6" stroke-linecap="round"/>
      <g stroke="#f2b705" stroke-width="1.8" stroke-linecap="round">
        <path d="M18 5 h3"/><path d="M18 9 h2"/><path d="M4 5 h-3"/><path d="M4 9 h-2"/>
      </g>
    </svg>
    Simulador de farmar aura
  </h1>

  <!-- ── termômetro: escala de -200 a +300, bulbo embaixo ── -->
  <div class="termo">
    <!-- o número vem ANTES do desenho: a coluna do termômetro é mais alta que a
         dos botões, e com o número embaixo ele caía para fora do cartão -->
    <div class="rotulo">AURA</div>
    <div class="valor mono" id="valor">0</div>
    <svg viewBox="0 0 120 300" aria-labelledby="tt td">
      <title id="tt">Termômetro de aura</title>
      <desc id="td">Um termômetro vertical com bulbo embaixo e escala de menos duzentos a mais
      trezentos. A coluna sobe e desce conforme a aura.</desc>
      <!-- tubo -->
      <rect x="20" y="18" width="28" height="256" rx="14" fill="#0d1434" stroke="#3b4784" stroke-width="2.5"/>
      <circle cx="34" cy="272" r="23" fill="#0d1434" stroke="#3b4784" stroke-width="2.5"/>
      <!-- coluna -->
      <rect id="coluna" x="26" y="169" width="16" height="101" rx="8" fill="#6c5ce7"/>
      <circle id="bulbo" cx="34" cy="272" r="17" fill="#6c5ce7"/>
      <!-- escala -->
      <g stroke="#8c97c9" stroke-width="1.8">
        <path d="M50 262 H58"/><path d="M50 239 H55"/><path d="M50 216 H58"/><path d="M50 193 H55"/>
        <path d="M50 169 H60"/><path d="M50 146 H55"/><path d="M50 123 H58"/><path d="M50 100 H55"/>
        <path d="M50 76 H58"/><path d="M50 53 H55"/><path d="M50 30 H58"/>
      </g>
      <g fill="#8c97c9" font-family="'Space Mono','Courier New',monospace" font-size="15">
        <text x="63" y="267">−200</text>
        <text x="63" y="221">−100</text>
        <text x="63" y="174" fill="#e9edff">0</text>
        <text x="63" y="128">100</text>
        <text x="63" y="81">200</text>
        <text x="63" y="35">300</text>
      </g>
    </svg>
  </div>

  <div class="direita">
    <div class="topo">
      <span class="rotulo">O QUE ACONTECEU</span>
      <span class="contador mono" id="contador">0 de 8 cliques</span>
    </div>

    <div class="fita" id="fita"></div>

    <div class="acoes" id="acoes">
      <!-- six seven: os braços alternam entre cima e baixo -->
      <button class="acao" data-p="7" type="button">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="11" r="6" fill="#e9edff"/>
          <rect x="19" y="19" width="10" height="17" rx="5" fill="#e9edff"/>
          <g stroke="#e9edff" stroke-width="4.5" stroke-linecap="round" fill="none">
            <path d="M22 37 L18 46"/><path d="M26 37 L30 46"/>
            <g class="braco-a"><path d="M20 22 L10 12"/><path d="M28 22 L38 12"/></g>
            <g class="braco-b"><path d="M20 24 L10 33"/><path d="M28 24 L38 33"/></g>
          </g>
        </svg>
        <span>Fazer o six seven no corredor</span>
        <span class="n mais">+7</span>
      </button>

      <button class="acao" data-p="6" type="button">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M4 42 Q10 16 28 9" stroke="#6c5ce7" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
          <rect x="27" y="5" width="17" height="12" rx="2" fill="none" stroke="#e9edff" stroke-width="2.4"/>
          <path d="M30 17 h11" stroke="#e07b2a" stroke-width="3" stroke-linecap="round"/>
          <path d="M31 19 l2 7 M35.5 19 v8 M40 19 l-2 7" stroke="#e9edff" stroke-width="1.6" fill="none"/>
          <circle cx="35.5" cy="33" r="7" fill="#e07b2a"/>
          <g stroke="#7a3d10" stroke-width="1.2" fill="none">
            <path d="M28.5 33 H42.5"/><path d="M35.5 26 V40"/>
          </g>
        </svg>
        <span>Acertar a cesta do meio da quadra</span>
        <span class="n mais">+6</span>
      </button>

      <button class="acao" data-p="10" type="button">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <g transform="rotate(-9 15 26)">
            <path d="M5 34 L19 14 L23 34 Z" fill="#f2b705"/>
            <path d="M7 30 L20 21" stroke="#c2410c" stroke-width="2.6" fill="none"/>
          </g>
          <g transform="rotate(9 33 26)">
            <path d="M43 34 L29 14 L25 34 Z" fill="#f2b705"/>
            <path d="M41 30 L28 21" stroke="#c2410c" stroke-width="2.6" fill="none"/>
          </g>
          <g stroke="#3ddc84" stroke-width="2.2" stroke-linecap="round" fill="none">
            <path d="M19 42 L13 42"/><path d="M29 42 L35 42"/>
          </g>
        </svg>
        <span>Dividir o lanche com quem esqueceu</span>
        <span class="n mais">+10</span>
      </button>

      <button class="acao" data-p="3" type="button">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M4 16 h10 l4 -5 h12 l4 5 h10 a3 3 0 0 1 3 3 v18 a3 3 0 0 1 -3 3 H4 a3 3 0 0 1 -3 -3 V19 a3 3 0 0 1 3 -3 z"
                fill="#1b2452" stroke="#e9edff" stroke-width="2"/>
          <circle cx="24" cy="28" r="8" fill="none" stroke="#e9edff" stroke-width="2.4"/>
          <circle cx="24" cy="28" r="3.2" fill="#6c5ce7"/>
          <circle cx="39" cy="21" r="1.8" fill="#f2b705"/>
        </svg>
        <span>Tirar foto com o palestrante</span>
        <span class="n mais">+3</span>
      </button>

      <button class="acao" data-p="-5" type="button">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M6 8 h36 a4 4 0 0 1 4 4 v18 a4 4 0 0 1 -4 4 H20 l-9 8 v-8 H6 a4 4 0 0 1 -4 -4 V12 a4 4 0 0 1 4 -4 z"
                fill="#1b2452" stroke="#ff5c7a" stroke-width="2"/>
          <g stroke="#ff5c7a" stroke-width="2.6" stroke-linecap="round" fill="none">
            <path d="M10 21 v4"/><path d="M16 15 v16"/><path d="M22 18 v10"/>
            <path d="M28 13 v20"/><path d="M34 17 v12"/><path d="M40 20 v6"/>
          </g>
        </svg>
        <span>Mandar áudio de 4 minutos no grupo</span>
        <span class="n menos">−5</span>
      </button>

      <button class="acao" data-p="-3" type="button">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M24 6 L45 15 L24 24 L3 15 Z" fill="#e9edff"/>
          <path d="M11 19 v9 a13 7 0 0 0 26 0 v-9" fill="none" stroke="#e9edff" stroke-width="2.4"/>
          <path d="M26 34 h14 a3 3 0 0 1 3 3 v6 a3 3 0 0 1 -3 3 h-9 l-5 4 v-4 a3 3 0 0 1 0 -12 z"
                fill="#ff5c7a"/>
          <path d="M34 39 c-2 -2 -4 -3 -4 -5 a2 2 0 0 1 4 -1 a2 2 0 0 1 4 1 c0 2 -2 3 -4 5 z" fill="#1b2452"/>
        </svg>
        <span>Chamar o professor de "mãe"</span>
        <span class="n menos">−3</span>
      </button>
    </div>

    <div class="rodape">
      <span class="aviso" id="aviso"></span>
      <button class="reset" id="reset" type="button">Recomeçar</button>
    </div>
  </div>

  <script type="module">
    // A LEI NÃO MORA AQUI. Esta página só manda a lista dos botões clicados e desenha
    // o que o banco devolve (gincana_aura, em 10_aura.sql). Quem abrir o inspetor vê
    // os cliques e os números, que é exatamente o que a tela já mostra.
    import { supabase } from '../comum/auth.js'

    const $ = id => document.getElementById(id)

    // geometria do termômetro: a escala vai de V_MIN a V_MAX entre Y_BASE e Y_TOPO
    const Y_BASE = 262, Y_TOPO = 30, Y_BULBO = 270
    let V_MIN = -200, V_MAX = 300
    const alturaDe = v => {
      const preso = Math.min(V_MAX, Math.max(V_MIN, v))
      return Y_BASE - (preso - V_MIN) * (Y_BASE - Y_TOPO) / (V_MAX - V_MIN)
    }

    let cliques = []
    let ocupado = false

    function pintar(valores, teto) {
      const ultimo = valores[valores.length - 1]
      const antes = valores.length > 1 ? valores[valores.length - 2] : ultimo

      const v = $('valor')
      v.textContent = ultimo
      v.className = 'valor mono' + (ultimo > antes ? ' sobe' : ultimo < antes ? ' desce' : '')

      const cor = ultimo < 0 ? '#ff5c7a' : '#6c5ce7'
      const y = alturaDe(ultimo)
      const col = $('coluna')
      col.setAttribute('y', y)
      col.setAttribute('height', Math.max(2, Y_BULBO - y))
      col.setAttribute('fill', cor)
      $('bulbo').setAttribute('fill', cor)

      $('fita').innerHTML = valores
        .map((n, i) => `<span${i === valores.length - 1 ? ' class="ultimo"' : ''}>${n}</span>`).join('')
      $('contador').textContent = `${cliques.length} de ${teto} cliques`

      const cheio = cliques.length >= teto
      for (const b of document.querySelectorAll('button.acao')) b.disabled = cheio
      $('aviso').textContent = cheio ? 'O termômetro saturou. Recomece para outra rodada.' : ''
    }

    async function pedir() {
      const { data, error } = await supabase.rpc('gincana_aura', { p_cliques: cliques.join(',') })
      if (error) throw error
      if (typeof data.min === 'number') { V_MIN = data.min; V_MAX = data.max }
      pintar(data.valores, data.teto)
    }

    $('acoes').addEventListener('click', async ev => {
      const b = ev.target.closest('button.acao')
      if (!b || ocupado) return
      ocupado = true
      cliques.push(b.dataset.p)
      try { await pedir() } catch (e) { cliques.pop(); $('aviso').textContent = e.message || String(e) }
      finally { ocupado = false }
    })

    $('reset').addEventListener('click', async () => {
      cliques = []
      try { await pedir() } catch (e) { $('aviso').textContent = e.message || String(e) }
    })

    try { await pedir() } catch { $('aviso').textContent = 'Entre na gincana para usar o termômetro.' }
  </script>
</body>
</html>
