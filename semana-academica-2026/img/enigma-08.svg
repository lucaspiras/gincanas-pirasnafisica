<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" width="2080" height="1240"
     role="img" aria-labelledby="t8 d8">
  <title id="t8">Um calçadão de praia com uma placa de rua raspada</title>
  <desc id="d8">Praia ensolarada com dois morros escuros no fundo à direita e o mar ao longe. Em
  primeiro plano, um calçadão de pedras pretas e brancas em losangos, onde uma pessoa caminha e um
  violão está deitado. À esquerda, um poste de esquina segura pela ponta uma placa de rua azul,
  com a palavra RUA no alto: o nome foi raspado, e embaixo dele ficou o ano 1979.</desc>
  <style><![CDATA[
    svg {
      --ceu-topo:  #3f93c8;  --ceu-base: #c6e7f6;
      --sol:       #fff2c4;
      --morro:     #121419;  --morro-e:  #24272f;
      --mar:       #1d7f99;  --mar-e:    #14657c;  --espuma: #eaf7fb;
      --areia:     #efd9a6;  --areia-m:  #e0c184;  --areia-e: #cba86b;
      --pedra-c:   #f4f1ea;  --pedra-p:  #1b1d22;  --meiofio: #cfc6b4;
      --pele:      #cf9a63;  --pele-e:   #ab7a4a;
      --cabelo:    #2b1d16;
      --maio:      #de4f74;
      --madeira:   #c98a4b;  --madeira-e:#a56c34;  --tampo: #f0d9ae;
      --corda:     #6b5638;  --buraco:   #3a2a18;
      --poste:     #9aa4ad;  --poste-e:  #79848d;
      --placa:     #14479b;  --placa-b:  #ffffff;
      --raspado:   #b9bec8;  --risco:    #8f95a2;
    }
    .ceu     { fill: url(#gradCeu8); }
    .sol     { fill: var(--sol); }
    .morro   { fill: var(--morro); }   .morroE { fill: var(--morro-e); }
    .mar     { fill: var(--mar); }     .marE   { fill: var(--mar-e); }
    .espuma  { fill: none; stroke: var(--espuma); stroke-width: 4; stroke-linecap: round; }
    .areia   { fill: var(--areia); }   .areiaM { fill: var(--areia-m); }
    .areiaE  { fill: var(--areia-e); }
    .calcada { fill: url(#ladrilho8); }
    .meiofio { fill: var(--meiofio); }
    .pele    { fill: var(--pele); }    .peleE  { fill: var(--pele-e); }
    .membro  { fill: none; stroke: var(--pele); stroke-width: 12; stroke-linecap: round; }
    .cabelo  { fill: var(--cabelo); }
    .maio    { fill: var(--maio); }
    .madeira { fill: var(--madeira); } .madeiraE { fill: var(--madeira-e); }
    .tampo   { fill: var(--tampo); }
    .corda   { fill: none; stroke: var(--corda); stroke-width: 1.6; }
    .buraco  { fill: var(--buraco); }
    .poste   { fill: var(--poste); }   .posteE { fill: var(--poste-e); }
    .placa   { fill: var(--placa); }
    .placaB  { fill: none; stroke: var(--placa-b); stroke-width: 2.5; }
    .raspado { fill: var(--raspado); }
    .risco   { fill: none; stroke: var(--risco); stroke-width: 3; stroke-linecap: round; }
    .ano     { fill: var(--placa-b); font-family: 'DM Sans', system-ui, sans-serif;
               font-weight: 700; font-size: 23px; letter-spacing: 3px; text-anchor: middle; }
    .rotulo  { fill: var(--placa-b); font-family: 'DM Sans', system-ui, sans-serif;
               font-weight: 700; font-size: 15px; letter-spacing: 3px; }
    .sombra  { fill: #000; opacity: .16; }
  ]]></style>

  <defs>
    <linearGradient id="gradCeu8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f93c8"/>
      <stop offset="1" stop-color="#c6e7f6"/>
    </linearGradient>
    <!-- Pedra portuguesa, em losangos. -->
    <pattern id="ladrilho8" width="42" height="42" patternUnits="userSpaceOnUse">
      <rect width="42" height="42" fill="#efece4"/>
      <path d="M21 3 L39 21 L21 39 L3 21 Z" fill="#2a2d34"/>
      <path d="M21 13 L29 21 L21 29 L13 21 Z" fill="#efece4"/>
      <path d="M0 0 L5 0 L0 5 Z M42 0 L37 0 L42 5 Z M0 42 L5 42 L0 37 Z M42 42 L37 42 L42 37 Z" fill="#2a2d34"/>
    </pattern>
  </defs>

  <rect class="ceu" x="0" y="0" width="1040" height="322"/>
  <circle class="sol" cx="548" cy="86" r="38"/>

  <!-- os dois morros, escuros -->
  <path class="morro" d="M648 322
                         C 690 296, 736 250, 782 190
                         C 796 170, 818 170, 830 192
                         C 842 216, 852 240, 862 258
                         C 876 228, 894 186, 918 150
                         C 932 128, 954 130, 964 152
                         C 992 214, 1018 280, 1040 322 Z"/>
  <path class="morroE" d="M941 140 C 952 140, 960 144, 964 152
                          C 992 214, 1018 280, 1040 322 L 934 322
                          C 946 276, 948 200, 941 140 Z"/>
  <path class="morroE" d="M806 178 C 818 174, 826 180, 830 192
                          C 842 216, 852 240, 862 258 L 848 322 L 796 322
                          C 810 274, 814 220, 806 178 Z" opacity=".7"/>

  <!-- mar -->
  <rect class="mar" x="0" y="318" width="1040" height="70"/>
  <rect class="marE" x="0" y="318" width="1040" height="13"/>
  <g class="espuma">
    <path d="M56 352 q18 -8 36 0 q18 8 36 0"/>
    <path d="M296 366 q18 -8 36 0 q18 8 36 0"/>
    <path d="M612 350 q18 -8 36 0 q18 8 36 0"/>
    <path d="M866 368 q18 -8 36 0 q18 8 36 0"/>
  </g>

  <!-- areia -->
  <rect class="areia" x="0" y="384" width="1040" height="90"/>
  <path class="areiaM" d="M0 384 h1040 v16 c-200 10, -420 -6, -620 5 C 240 414, 120 402, 0 408 Z"/>
  <g class="areiaE" opacity=".45">
    <ellipse cx="300" cy="452" rx="26" ry="5"/>
    <ellipse cx="880" cy="440" rx="22" ry="4"/>
  </g>

  <!-- calçadão -->
  <rect class="meiofio" x="0" y="468" width="1040" height="14"/>
  <rect class="calcada" x="0" y="482" width="1040" height="138"/>

  <!-- quem caminha -->
  <g transform="translate(736 594) scale(1.12)">
    <ellipse class="sombra" cx="0" cy="4" rx="44" ry="8"/>
    <path class="membro" d="M-6 -66 C -18 -40, -26 -18, -30 0"/>
    <path class="membro" d="M4 -66 C 16 -44, 24 -20, 26 0"/>
    <path class="peleE" d="M-41 0 h19 v7 h-19 z"/>
    <path class="peleE" d="M19 0 h19 v7 h-19 z"/>
    <path class="pele" d="M-16 -132 C 2 -136, 18 -128, 18 -110 L 16 -74 C 14 -64, -12 -64, -14 -74 Z"/>
    <path class="maio" d="M-15 -78 C -2 -72, 8 -72, 17 -78 L 16 -62 C 6 -56, -8 -56, -14 -62 Z"/>
    <path class="maio" d="M-16 -116 C -4 -110, 8 -110, 18 -116 L 18 -104 C 6 -98, -6 -98, -16 -104 Z"/>
    <path class="membro" d="M-16 -124 C -32 -106, -38 -84, -35 -64" stroke-width="10"/>
    <path class="membro" d="M18 -124 C 32 -106, 36 -86, 33 -68" stroke-width="10"/>
    <circle class="pele" cx="4" cy="-150" r="17"/>
    <path class="cabelo" d="M-14 -150 C -16 -172, 2 -180, 16 -172 C 26 -166, 24 -150, 20 -146
                            C 20 -158, 12 -164, 2 -162 C -4 -152, -6 -136, -12 -122
                            C -20 -124, -18 -138, -14 -150 Z"/>
  </g>

  <!-- o violão, deitado no calçadão -->
  <g transform="translate(452 566) rotate(-13) scale(.86)">
    <ellipse class="sombra" cx="0" cy="26" rx="100" ry="11"/>
    <rect class="madeiraE" x="26" y="-9" width="118" height="18" rx="5"/>
    <rect class="madeira" x="132" y="-16" width="30" height="32" rx="6"/>
    <path class="madeira" d="M-88 0 C -88 -34, -56 -46, -34 -34 C -18 -26, -6 -26, 8 -34
                             C 26 -44, 44 -34, 44 -10 C 44 12, 26 22, 8 14 C -6 6, -18 6, -34 14
                             C -56 26, -88 16, -88 0 Z"/>
    <path class="tampo" d="M-80 0 C -80 -28, -54 -38, -36 -28 C -18 -18, -6 -18, 6 -28
                           C 22 -38, 38 -30, 38 -10 C 38 8, 22 16, 6 9 C -6 3, -18 3, -36 10
                           C -54 20, -80 12, -80 0 Z"/>
    <circle class="buraco" cx="-38" cy="-6" r="15"/>
    <rect class="madeiraE" x="8" y="-12" width="9" height="24" rx="3"/>
    <g class="corda">
      <path d="M12 -9 L138 -7"/>
      <path d="M12 -4 L138 -3"/>
      <path d="M12 1 L138 1"/>
      <path d="M12 6 L138 5"/>
    </g>
  </g>

  <!-- o poste de esquina, com a placa azul -->
  <g>
    <ellipse class="sombra" cx="106" cy="600" rx="38" ry="9"/>
    <rect class="poste" x="96" y="250" width="18" height="354" rx="4"/>
    <rect class="posteE" x="107" y="250" width="7" height="354"/>

    <!-- a placa, presa ao poste por uma ponta, como as de rua -->
    <rect class="placa" x="86" y="232" width="268" height="112" rx="7"/>
    <rect class="placaB" x="94" y="240" width="252" height="96" rx="4"/>
    <text class="rotulo" x="108" y="264">RUA</text>

    <!-- o nome, raspado -->
    <g class="raspado">
      <path d="M112 278 h44 l7 26 h-52 z"/>
      <path d="M172 274 h38 l-5 30 h-35 z"/>
      <path d="M220 280 h31 l9 24 h-39 z"/>
      <path d="M268 276 h35 l-4 28 h-31 z"/>
    </g>
    <g class="risco">
      <path d="M108 306 L162 270"/>
      <path d="M150 308 L208 272"/>
      <path d="M200 306 L258 270"/>
      <path d="M250 308 L306 272"/>
      <path d="M110 274 L332 300" opacity=".7"/>
    </g>

    <path class="placaB" d="M104 315 H336"/>
    <text class="ano" x="220" y="333">1979</text>
  </g>
</svg>
