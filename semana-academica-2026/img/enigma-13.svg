<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="2080" height="1120"
     role="img" aria-labelledby="t13 d13">
  <title id="t13">Uma parede com o alfabeto e um cordão de lâmpadas</title>
  <desc id="d13">Numa parede escura, o alfabeto pintado à mão em duas fileiras, de A a M em cima e
  de N a Z embaixo. Sobre cada fileira pende um cordão de lâmpadas, uma lâmpada acima de cada
  letra. Seis lâmpadas estão acesas e trazem um número pequeno embaixo; as outras vinte estão
  apagadas.</desc>
  <style><![CDATA[
    svg {
      --parede:  #2b2420;  --parede-b: #1d1815;  --risco: #3a312b;
      --letra:   #ddd2bf;
      --fio:     #4a4038;  --soquete: #5c5046;
      --apagada: #55504a;  --acesa:   #ffd452;
      --num:     #ffb35c;
    }
    .parede   { fill: url(#gradParede13); }
    .risco    { fill: none; stroke: var(--risco); stroke-width: 2; }
    .moldura  { fill: none; stroke: #3a312b; stroke-width: 2; }
    .letra    { fill: var(--letra); font-family: 'DM Sans', system-ui, sans-serif;
                font-weight: 800; font-size: 46px; text-anchor: middle; opacity: .92; }
    .fio      { fill: none; stroke: var(--fio); stroke-width: 3; }
    .soquete  { fill: none; stroke: var(--soquete); stroke-width: 4; stroke-linecap: round; }
    .apagada  { fill: var(--apagada); }
    .acesa    { fill: var(--acesa); }
    .halo     { fill: url(#gradHalo13); }
    .num      { fill: var(--num); font-family: 'Space Mono', ui-monospace, monospace;
                font-weight: 700; font-size: 17px; text-anchor: middle; }
  ]]></style>

