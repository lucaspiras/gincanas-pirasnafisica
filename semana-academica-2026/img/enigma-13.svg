<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" width="2080" height="880"
     role="img" aria-labelledby="t13 d13">
  <title id="t13">Duas fileiras de lâmpadas que piscam em sequência</title>
  <desc id="d13">Numa parede escura, dois cordões de treze lâmpadas iguais, um acima do outro,
  todas apagadas. Uma lâmpada de cada vez acende e apaga, sempre na mesma ordem, e o ciclo
  recomeça. Não há nenhuma letra nem número escrito na imagem.</desc>
  <style><![CDATA[
    svg {
      --parede:  #2b2420;  --parede-b: #1a1512;  --risco: #382f29;
      --fio:     #4a4038;  --soquete: #5c5046;
      --apagada: #514c46;  --acesa:   #ffd452;  --ordem: #ffb35c;
    }
    .parede  { fill: url(#gradParede13); }
    .risco   { fill: none; stroke: var(--risco); stroke-width: 2; }
    .moldura { fill: none; stroke: #3a312b; stroke-width: 2; }
    .fio     { fill: none; stroke: var(--fio); stroke-width: 3; }
    .soquete { fill: none; stroke: var(--soquete); stroke-width: 4; stroke-linecap: round; }
    .apagada { fill: var(--apagada); }
    .acesa   { fill: var(--acesa); }
    .halo    { fill: url(#gradHalo13); }
    .ordem   { fill: var(--ordem); font-family: 'Space Mono', ui-monospace, monospace;
               font-weight: 700; font-size: 17px; text-anchor: middle; }

    .pisca   { opacity: 0; animation: acende 7.5s linear infinite; }
    .parado  { display: none; }

    @keyframes acende {
      0%                  { opacity: 0; }
      1.067%        { opacity: 1; }
      6.667%  { opacity: 1; }
      8.0%       { opacity: 0; }
      100%                { opacity: 0; }
    }

    /* Quem pede menos movimento não consegue ler uma sequência. Nesse caso as
       acesas aparecem todas de uma vez, com o número da ordem embaixo. */
    @media (prefers-reduced-motion: reduce) {
      .pisca  { display: none; }
      .parado { display: block; }
    }
  ]]></style>

  <defs>
    <linearGradient id="gradParede13" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2420"/><stop offset="1" stop-color="#1a1512"/>
    </linearGradient>
    <radialGradient id="gradHalo13" cx=".5" cy=".5" r=".5">
      <stop offset="0"   stop-color="#ffd452" stop-opacity=".60"/>
      <stop offset=".5"  stop-color="#ffd452" stop-opacity=".20"/>
      <stop offset="1"   stop-color="#ffd452" stop-opacity="0"/>
    </radialGradient>
  </defs>

