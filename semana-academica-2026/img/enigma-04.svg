  <rect class="asfalto" x="0" y="250" width="1040" height="310"/>
  <g class="faixa">
    <path d="M124 252 L156 252 L90 560 L30 560 Z"/>
    <path d="M224 252 L256 252 L218 560 L158 560 Z"/>
    <path d="M324 252 L356 252 L346 560 L286 560 Z"/>
    <path d="M424 252 L456 252 L474 560 L414 560 Z"/>
