    <path class="carro" d="M-4 -38 v28"/>
    <circle class="pneu" cx="-62" cy="28" r="20"/>
    <circle class="aro"  cx="-62" cy="28" r="8"/>
    <circle class="pneu" cx="58" cy="28" r="20"/>
    <circle class="aro"  cx="58" cy="28" r="8"/>
    <!-- a placa existe, mas é pequena demais para ser lida -->
