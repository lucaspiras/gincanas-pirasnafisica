<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="2080" height="1120"
     role="img" aria-labelledby="t4 d4">
  <title id="t4">Quatro pessoas atravessando uma faixa de pedestres</title>
  <desc id="d4">Quatro pessoas atravessam uma rua sobre a faixa de pedestres, em fila, da esquerda
  para a direita. A primeira usa terno branco, a segunda terno escuro, a terceira terno claro e
  está descalça, e a quarta usa camisa e calça jeans. À esquerda, estacionado na calçada do outro
  lado, um facho de luz vindo de cima ilumina um fusca claro; a placa dele existe, mas está em
  branco, pequena demais para ser lida.</desc>
  <style><![CDATA[
    svg {
      --ceu:      #d6e4ef;  --ceu-b:   #eef4f8;
      --predio:   #b7c0ca;  --predio-e:#98a3ae;  --janela: #dfe7ee;
      --arvore:   #4a7a52;  --tronco:  #6b5136;
      --calcada:  #d9d6cd;  --meiofio: #c2beb2;
      --asfalto:  #74797e;  --asfalto-e:#63686d;
      --faixa:    #f2f1ec;
      --carro:    #f2f2ee;  --carro-e: #d3d3ce;  --vidro: #9fb6c4;
      --pneu:     #2c2e32;  --aro:     #c9cbcf;
      --placa:    #e6d472;  --placa-b: #8d8046;
      --pele:     #e3b78f;  --pele-e:  #c9986d;
      --t1:       #f6f6f2;  --t1e:     #dcdcd6;
      --t2:       #2b2e34;  --t2e:     #1d1f24;
      --t3:       #9db0c6;  --t3e:     #8296ae;
      --t4:       #4a6f96;  --t4e:     #3b5a7c;
      --cabelo:   #33231a;  --cabelo2: #21160f;
      --cigarro:  #f7f5ee;
    }
    .ceu     { fill: url(#gradCeu4); }
    .predio  { fill: var(--predio); }  .predioE { fill: var(--predio-e); }
    .janela  { fill: var(--janela); }
    .arvore  { fill: var(--arvore); }  .tronco  { fill: var(--tronco); }
    .calcada { fill: var(--calcada); } .meiofio { fill: var(--meiofio); }
    .asfalto { fill: var(--asfalto); }
    .faixa   { fill: var(--faixa); }
    .carro   { fill: var(--carro); }   .carroE  { fill: var(--carro-e); }
    .vidro   { fill: var(--vidro); }
    .pneu    { fill: var(--pneu); }    .aro     { fill: var(--aro); }
    .placa   { fill: var(--placa); stroke: var(--placa-b); stroke-width: 1.5; }
    .pele    { fill: var(--pele); }    .peleE   { fill: var(--pele-e); }
    .cabelo  { fill: var(--cabelo); }  .cabelo2 { fill: var(--cabelo2); }
    .cigarro { fill: var(--cigarro); }
    .t1  { fill: var(--t1); }  .t1e { fill: var(--t1e); }
    .t2  { fill: var(--t2); }  .t2e { fill: var(--t2e); }
    .t3  { fill: var(--t3); }  .t3e { fill: var(--t3e); }
    .t4  { fill: var(--t4); }  .t4e { fill: var(--t4e); }
    .p1  { fill: none; stroke: var(--t1);  stroke-width: 14; stroke-linecap: round; }
    .p2  { fill: none; stroke: var(--t2);  stroke-width: 14; stroke-linecap: round; }
    .p3  { fill: none; stroke: var(--t3);  stroke-width: 14; stroke-linecap: round; }
    .p4  { fill: none; stroke: var(--t4);  stroke-width: 14; stroke-linecap: round; }
    .b1  { fill: none; stroke: var(--t1);  stroke-width: 11; stroke-linecap: round; }
    .b2  { fill: none; stroke: var(--t2);  stroke-width: 11; stroke-linecap: round; }
    .b3  { fill: none; stroke: var(--t3);  stroke-width: 11; stroke-linecap: round; }
    .b4  { fill: none; stroke: var(--t4);  stroke-width: 11; stroke-linecap: round; }
    .sapato { fill: #23252a; }
    .sombra { fill: #000; opacity: .14; }
  ]]></style>

  <defs>
    <linearGradient id="gradCeu4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6e4ef"/>
      <stop offset="1" stop-color="#eef4f8"/>
    </linearGradient>
    <linearGradient id="gradFeixe4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#fff6cf" stop-opacity=".62"/>
      <stop offset=".62" stop-color="#fff6cf" stop-opacity=".30"/>
      <stop offset="1"   stop-color="#fff6cf" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gradFoco4" cx=".5" cy=".5" r=".5">
      <stop offset="0"   stop-color="#fff3bf" stop-opacity=".70"/>
      <stop offset=".52" stop-color="#fff3bf" stop-opacity=".26"/>
      <stop offset="1"   stop-color="#fff3bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect class="ceu" x="0" y="0" width="1040" height="200"/>

  <!-- fundo: prédio e árvores -->
  <rect class="predio" x="330" y="34" width="330" height="152"/>
  <rect class="predioE" x="330" y="34" width="18" height="152"/>
  <g class="janela">
    <rect x="368" y="58" width="34" height="40" rx="3"/>
    <rect x="424" y="58" width="34" height="40" rx="3"/>
    <rect x="480" y="58" width="34" height="40" rx="3"/>
    <rect x="536" y="58" width="34" height="40" rx="3"/>
    <rect x="592" y="58" width="34" height="40" rx="3"/>
    <rect x="368" y="116" width="34" height="40" rx="3"/>
