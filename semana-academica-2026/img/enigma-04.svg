    <rect x="480" y="116" width="34" height="40" rx="3"/>
    <rect x="536" y="116" width="34" height="40" rx="3"/>
    <rect x="592" y="116" width="34" height="40" rx="3"/>
  </g>
  <g>
    <rect class="tronco" x="740" y="120" width="13" height="66"/>
    <circle class="arvore" cx="746" cy="104" r="46"/>
    <rect class="tronco" x="862" y="132" width="11" height="54"/>
    <circle class="arvore" cx="867" cy="118" r="38"/>
  </g>

  <!-- calçada do outro lado -->
  <rect class="calcada" x="0" y="186" width="1040" height="62"/>
  <rect class="meiofio" x="0" y="242" width="1040" height="8"/>

  <!-- a luz que cai sobre o carro: o facho vem por trás, para o carro
       continuar nítido, e só um véu fino passa por cima dele -->
  <g>
    <path fill="url(#gradFeixe4)" d="M144 0 H210 L292 244 H60 Z"/>
    <ellipse fill="url(#gradFoco4)" cx="176" cy="206" rx="146" ry="98"/>
  </g>

