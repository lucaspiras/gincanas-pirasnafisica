<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="1600" height="1000"
     role="img" aria-labelledby="t2 d2">
  <title id="t2">Cena noturna em frente a uma casa de shows</title>
  <desc id="d2">Uma pessoa sentada na calçada, ao lado de um poste, diante de uma fachada com
  janelas acesas e um letreiro de neon azul.</desc>
  <style><![CDATA[
    svg {
      --ceu-topo:   #080c1f;
      --ceu-base:   #1b2450;
      --predio:     #131a34;
      --predio-luz: #1d2550;
      --borda:      #2b3566;
      --acesa:      #ffd166;
      --apagada:    #0d1330;
      --neon:       #4cc9f0;
      --calcada:    #242a44;
      --meio-fio:   #333a5c;
      --pele:       #e3b18c;
      --roupa:      #37477e;
      --cabelo:     #1d2338;
      --coracao:    #ef476f;
      --vidro:      #9fb3d9;
      --astro:      #f2efe4;
    }
    .ceu     { fill: url(#gradCeu2); }
    .astro   { fill: var(--astro); }
    .estrela { fill: var(--astro); }
    .predio  { fill: var(--predio); stroke: var(--borda); stroke-width: 2; }
    .frente  { fill: var(--predio-luz); }
    .acesa   { fill: var(--acesa); }
    .apagada { fill: var(--apagada); }
    .neon    { fill: none; stroke: var(--neon); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .neonf   { fill: var(--neon); }
    .calcada { fill: var(--calcada); }
    .meiofio { fill: var(--meio-fio); }
    .poste   { fill: var(--meio-fio); }
    .luz     { fill: var(--acesa); }
    .pele    { fill: var(--pele); }
    .roupa   { fill: var(--roupa); }
    .cabelo  { fill: var(--cabelo); }
    .coracao { fill: var(--coracao); }
    .vidro   { fill: var(--vidro); }
    .tampa   { fill: var(--coracao); }
    .risco   { fill: none; stroke: var(--ceu-topo); stroke-width: 3; stroke-linecap: round; }
  ]]></style>

  <defs>
    <linearGradient id="gradCeu2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080c1f"/>
      <stop offset="1" stop-color="#1b2450"/>
    </linearGradient>
    <radialGradient id="brilhoNeon">
      <stop offset="0" stop-color="#4cc9f0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#4cc9f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brilhoLuz">
      <stop offset="0" stop-color="#ffd166" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- céu e astros -->
  <rect class="ceu" x="0" y="0" width="800" height="500"/>
  <circle class="astro" cx="694" cy="78" r="26" opacity=".92"/>
  <circle class="ceu" cx="682" cy="70" r="24"/>
  <g class="estrela" opacity=".8">
    <circle cx="70" cy="60" r="2"/><circle cx="130" cy="110" r="1.6"/><circle cx="210" cy="45" r="2.2"/>
    <circle cx="300" cy="90" r="1.5"/><circle cx="390" cy="50" r="2"/><circle cx="470" cy="105" r="1.7"/>
    <circle cx="560" cy="62" r="2.1"/><circle cx="620" cy="130" r="1.5"/><circle cx="740" cy="170" r="1.8"/>
    <circle cx="90" cy="190" r="1.5"/><circle cx="35" cy="130" r="1.9"/><circle cx="760" cy="55" r="1.6"/>
  </g>

  <!-- calçada -->
  <rect class="calcada" x="0" y="430" width="800" height="70"/>
  <rect class="meiofio" x="0" y="430" width="800" height="6"/>

  <!-- prédio -->
  <rect class="predio" x="260" y="150" width="300" height="280"/>
  <rect class="frente" x="272" y="162" width="276" height="256"/>

  <!-- Janelas: grade de 9 x 5. -->
  <g>
    <rect class="apagada" x="279" y="190" width="22" height="16"/><rect class="acesa"   x="309" y="190" width="22" height="16"/><rect class="acesa"   x="339" y="190" width="22" height="16"/><rect class="apagada" x="369" y="190" width="22" height="16"/><rect class="apagada" x="399" y="190" width="22" height="16"/><rect class="apagada" x="429" y="190" width="22" height="16"/><rect class="acesa"   x="459" y="190" width="22" height="16"/><rect class="acesa"   x="489" y="190" width="22" height="16"/><rect class="apagada" x="519" y="190" width="22" height="16"/>
    <rect class="acesa"   x="279" y="214" width="22" height="16"/><rect class="apagada" x="309" y="214" width="22" height="16"/><rect class="apagada" x="339" y="214" width="22" height="16"/><rect class="acesa"   x="369" y="214" width="22" height="16"/><rect class="apagada" x="399" y="214" width="22" height="16"/><rect class="acesa"   x="429" y="214" width="22" height="16"/><rect class="apagada" x="459" y="214" width="22" height="16"/><rect class="apagada" x="489" y="214" width="22" height="16"/><rect class="acesa"   x="519" y="214" width="22" height="16"/>
    <rect class="acesa"   x="279" y="238" width="22" height="16"/><rect class="apagada" x="309" y="238" width="22" height="16"/><rect class="apagada" x="339" y="238" width="22" height="16"/><rect class="apagada" x="369" y="238" width="22" height="16"/><rect class="acesa"   x="399" y="238" width="22" height="16"/><rect class="apagada" x="429" y="238" width="22" height="16"/><rect class="apagada" x="459" y="238" width="22" height="16"/><rect class="apagada" x="489" y="238" width="22" height="16"/><rect class="acesa"   x="519" y="238" width="22" height="16"/>
    <rect class="acesa"   x="279" y="262" width="22" height="16"/><rect class="apagada" x="309" y="262" width="22" height="16"/><rect class="apagada" x="339" y="262" width="22" height="16"/><rect class="acesa"   x="369" y="262" width="22" height="16"/><rect class="apagada" x="399" y="262" width="22" height="16"/><rect class="acesa"   x="429" y="262" width="22" height="16"/><rect class="apagada" x="459" y="262" width="22" height="16"/><rect class="apagada" x="489" y="262" width="22" height="16"/><rect class="acesa"   x="519" y="262" width="22" height="16"/>
    <rect class="apagada" x="279" y="286" width="22" height="16"/><rect class="acesa"   x="309" y="286" width="22" height="16"/><rect class="acesa"   x="339" y="286" width="22" height="16"/><rect class="apagada" x="369" y="286" width="22" height="16"/><rect class="apagada" x="399" y="286" width="22" height="16"/><rect class="apagada" x="429" y="286" width="22" height="16"/><rect class="acesa"   x="459" y="286" width="22" height="16"/><rect class="acesa"   x="489" y="286" width="22" height="16"/><rect class="apagada" x="519" y="286" width="22" height="16"/>
  </g>

  <!-- letreiro de neon: taça e arco, sem palavra nenhuma -->
  <ellipse cx="410" cy="352" rx="96" ry="34" fill="url(#brilhoNeon)"/>
  <path class="neon" d="M368 336 h44 l-22 26 z"/>
  <path class="neon" d="M390 362 v16 M378 378 h24"/>
  <circle class="neonf" cx="398" cy="330" r="3.4"/>
  <path class="neon" d="M436 334 q16 14 0 28"/>
  <path class="neon" d="M452 328 q24 20 0 40" opacity=".65"/>

  <!-- porta -->
  <rect x="385" y="386" width="50" height="44" fill="#0b1029" stroke="#2b3566" stroke-width="2"/>
  <circle cx="427" cy="408" r="2.4" class="neonf"/>

  <!-- poste -->
  <ellipse cx="112" cy="268" rx="62" ry="52" fill="url(#brilhoLuz)"/>
  <rect class="poste" x="107" y="268" width="9" height="162"/>
  <rect class="poste" x="96" y="426" width="31" height="6"/>
  <path class="poste" d="M111 268 q0 -18 18 -18"/>
  <circle class="luz" cx="129" cy="252" r="9"/>

  <!-- pessoa sentada na calçada, encostada no poste -->
  <g>
    <path class="roupa" d="M148 430 q-6 -44 10 -62 q12 -14 26 -8 q10 4 8 16 l-6 34 q-2 14 -14 20 z"/>
    <path class="roupa" d="M168 424 q30 6 52 2 q8 -2 8 6 q0 6 -8 6 h-54 z"/>
    <path class="pele" d="M226 424 q10 -2 14 2 q4 4 -2 8 q-8 4 -14 -2 z"/>
    <circle class="pele" cx="170" cy="352" r="17"/>
    <path class="cabelo" d="M153 348 q2 -18 18 -18 q16 0 18 17 q-6 -8 -18 -8 q-12 0 -18 9 z"/>
    <path class="pele" d="M178 366 q-2 10 -8 12 q-6 2 -8 -6 z"/>
    <!-- braço sobre o peito -->
    <path class="roupa" d="M182 380 q16 6 14 20 q-2 12 -16 10 q-10 -2 -10 -12 q0 -12 12 -18 z"/>
    <path class="pele" d="M180 408 q10 2 12 -6 q2 -8 -6 -10 q-8 -2 -10 6 q-2 8 4 10 z"/>
  </g>

  <!-- coração trincado, flutuando -->
  <g transform="translate(214 284) rotate(-8)">
    <path class="coracao" d="M0 8 q-14 -16 -26 -6 q-12 10 2 24 l24 22 l24 -22 q14 -14 2 -24 q-12 -10 -26 6 z" opacity=".95"/>
    <path class="risco" d="M0 2 l-7 12 l9 7 l-6 13"/>
  </g>

  <!-- vidro de remédio e dois comprimidos -->
  <g transform="translate(250 396)">
    <rect class="vidro" x="0" y="8" width="18" height="26" rx="3"/>
    <rect class="tampa" x="2" y="2" width="14" height="8" rx="2"/>
    <circle class="vidro" cx="30" cy="30" r="4"/>
    <circle class="vidro" cx="41" cy="33" r="3.4"/>
  </g>
</svg>
