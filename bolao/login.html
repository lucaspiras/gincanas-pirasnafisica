<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Bolão da Copa 2026</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-TY56KM22X8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-TY56KM22X8');
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-page">
    <div class="auth-brand">
      <p class="eyebrow">Copa 2026</p>
      <h1>Bolão<br>da galera</h1>
      <div class="pitch-rule"></div>
      <p class="muted mt-12" id="subtitle">Entre com o e-mail e a senha que o organizador te passou.</p>
    </div>

    <form id="auth-form" class="auth-form">
      <input
        id="input-email"
        class="input"
        type="email"
        inputmode="email"
        autocomplete="email"
        placeholder="seu@email.com"
        required
      >
      <input
        id="input-password"
        class="input"
        type="password"
        autocomplete="current-password"
        placeholder="Senha"
        minlength="6"
        required
      >
      <button type="submit" class="btn btn-primary btn-full" id="btn-submit">
        Entrar
      </button>
      <p id="error-msg" class="error-msg hidden"></p>
    </form>

    <p class="muted mt-16 center" style="font-size:.85rem">
      Ainda não tem acesso? Fale com o organizador do bolão.
    </p>
  </main>

  <script type="module">
    import { supabase } from './supabase.js'

    const { data: { user: u } } = await supabase.auth.getUser()
    if (u) { location.replace('dashboard.html'); }

    const form   = document.getElementById('auth-form')
    const btn    = document.getElementById('btn-submit')
    const errMsg = document.getElementById('error-msg')

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      const email    = document.getElementById('input-email').value.trim()
      const password = document.getElementById('input-password').value
      btn.disabled = true
      btn.innerHTML = '<span class="spinner"></span>'
      errMsg.classList.add('hidden')

      const { error } = await supabase.auth.signInWithPassword({ email, password })
      if (error) {
        btn.disabled = false
        btn.textContent = 'Entrar'
        errMsg.textContent = error.message.includes('Invalid')
          ? 'E-mail ou senha incorretos.'
          : error.message
        errMsg.classList.remove('hidden')
        return
      }

      const { data: { user } } = await supabase.auth.getUser()
      const { data: profile } = await supabase
        .from('profiles').select('id').eq('id', user.id).maybeSingle()
      if (profile) {
        location.replace('dashboard.html')
      } else {
        // Conta sem perfil: acesso ainda não liberado pelo organizador.
        await supabase.auth.signOut()
        btn.disabled = false
        btn.textContent = 'Entrar'
        errMsg.textContent = 'Acesso ainda não liberado. Fale com o organizador.'
        errMsg.classList.remove('hidden')
      }
    })
  </script>
</body>
</html>
