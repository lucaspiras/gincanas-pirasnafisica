<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Gincanas</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://gincanas.pirasnafisica.com.br/entrar.html">
  <noscript><meta http-equiv="refresh" content="0; url=../entrar.html"></noscript>
  <script>
    // O login agora é único (entrar.html, na raiz do site). Esta página só encaminha,
    // preservando o ?redirect= — que era relativo a esta pasta e vira caminho completo.
    (function () {
      var alvo = new URL('../entrar.html', location.href);
      var r = new URLSearchParams(location.search).get('redirect');
      if (r) {
        try {
          var u = new URL(r, location.href);
          // Só aceita destino do próprio site (barra o //host e o https://outro).
          if (u.origin === location.origin) alvo.searchParams.set('redirect', u.pathname + u.search);
        } catch (e) {}
      }
      location.replace(alvo.href);
    })();
  </script>
</head>
<body>
  <p><a href="../entrar.html">Ir para o login das gincanas</a></p>
</body>
</html>
